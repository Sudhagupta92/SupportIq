server:
  port: 8080

spring:
  application:
    name: supportiq-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/supportiq}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

app:
  jwt:
    # Secret must be at least 256 bits (32 bytes). This default is 64 characters (512 bits) in hex/ASCII.
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    # Expiration: 24 hours in milliseconds = 86,400,000 ms
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  default-admin:
    email: ${ADMIN_EMAIL:admin@supportiq.com}
    password: ${ADMIN_PASSWORD:Admin@12345}
    name: ${ADMIN_NAME:SupportIQ Admin}
