server:
  port: 8080

spring:
  application:
    name: supportiq-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/supportiq}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  ai:
    vectorstore:
      pgvector:
        # Automatically initialize pgvector extension and vector_store table schema if not already present
        initialize-schema: true
        table-name: vector_store
        # CRITICAL VECTOR DIMENSION:
        # The pgvector dimension MUST match the embedding model's output dimension.
        # Google Gemini gemini-embedding-001 natively outputs 3072 dimensions, but supports
        # Matryoshka Representation Learning (MRL) outputDimensionality reduction down to 768.
        # SupportIQ configures outputDimensionality: 768 with client-side L2 normalization
        # to match this pgvector column dimension.
        dimensions: ${VECTOR_DIMENSION:768}
        distance-type: COSINE_DISTANCE
        index-type: HNSW
        # Vector store primary key ID type: matches 'id UUID' in schema-pgvector.sql
        id-type: uuid

app:
  jwt:
    # Secret must be at least 256 bits (32 bytes). This default is 64 characters (512 bits) in hex/ASCII.
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    # Expiration: 24 hours in milliseconds = 86,400,000 ms
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  default-admin:
    email: ${ADMIN_EMAIL:admin@supportiq.com}
    password: ${ADMIN_PASSWORD:Admin@12345}
    name: ${ADMIN_NAME:SupportIQ Admin}
  rag:
    gemini:
      # Google Gemini API Key configured strictly via environment variable (never commit keys)
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_EMBEDDING_MODEL:gemini-embedding-001}
      # Vector dimension matching pgvector dimensions above (768 for gemini-embedding-001 outputDimensionality)
      dimension: ${VECTOR_DIMENSION:768}
      batch-size: ${GEMINI_EMBEDDING_BATCH_SIZE:16}
    # Chunking parameters: target 800 characters with 100 characters overlap
    chunk-size: ${CHUNK_SIZE:800}
    chunk-overlap: ${CHUNK_OVERLAP:100}
    # Maximum allowed document upload size: 10 MB = 10,485,760 bytes
    max-file-size: ${MAX_FILE_SIZE:10485760}
    # Module 4: RAG Chat Configuration
    chat-top-k: ${APP_RAG_CHAT_TOP_K:4}
    # Chosen from manual tests (relevant questions scored about 0.65, an unrelated question about 0.50) and must be tuned later.
    min-score: ${APP_RAG_MIN_SCORE:0.58}
    chat-model: ${GEMINI_CHAT_MODEL:gemini-3.5-flash}
    fallback-chat-model: ${GEMINI_CHAT_FALLBACK_MODEL:${GEMINI_FALLBACK_CHAT_MODEL:gemini-3.1-flash-lite}}
    chat-rate-limit-per-minute: ${CHAT_RATE_LIMIT_PER_MINUTE:20}
    chat-timeout-seconds: ${CHAT_TIMEOUT_SECONDS:12}
    max-output-tokens: ${CHAT_MAX_OUTPUT_TOKENS:1000}
    temperature: ${CHAT_TEMPERATURE:0.2}
    order-intent-keywords: ${APP_ORDER_INTENT_KEYWORDS:order,orders,track,tracking,parcel,package,delivery,delivered,shipped,status,kahan,kab aayega,ye order,mera order}
  tickets:
    daily-limit: ${APP_TICKETS_DAILY_LIMIT:5}
  escalation:
    high-keywords: ${APP_ESCALATION_HIGH_KEYWORDS:fraud,scam,cheated,damaged,broken,dhokha,toota,loot,fake,chor}
    medium-keywords: ${APP_ESCALATION_MEDIUM_KEYWORDS:refund not received,refund,complaint,wrong item,manager,worst,angry,bekar,kharab,wapas nahi mila,not received,defective,gussa}
    explicit-keywords: ${APP_ESCALATION_EXPLICIT_KEYWORDS:create a ticket,create ticket,raise a ticket,raise ticket,ticket banao,ticket bana do,ticket bana de,ticket kholo,open a ticket,open ticket,talk to a human,talk to human,speak to a human,speak to human,speak with a human,speak with human,human agent,real agent,live agent,insaan se baat,insan se baat,bande se baat,support se baat karao,support se baat karwao,agent se baat,customer care se baat,complaint register,register complaint,file a complaint,file complaint,raise a complaint,raise complaint}
  demo-data:
    # Default true for local use and automated testing. MUST be set to false for any production deployment!
    enabled: ${APP_DEMO_DATA_ENABLED:${DEMO_DATA_ENABLED:true}}

