spring:
  autoconfigure:
    exclude:
      - org.springframework.ai.vectorstore.pgvector.autoconfigure.PgVectorStoreAutoConfiguration
  datasource:
    url: jdbc:h2:mem:supportiq_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

app:
  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    expiration-ms: 86400000
  default-admin:
    email: admin@supportiq.com
    password: Admin@12345
    name: SupportIQ Admin
  rag:
    gemini:
      api-key: test-api-key
      model: gemini-embedding-001
      dimension: 768
      batch-size: 16
    chunk-size: 800
    chunk-overlap: 100
    max-file-size: 10485760
    chat-top-k: 4
    min-score: 0.58
    chat-model: gemini-3.5-flash
    fallback-chat-model: gemini-3.1-flash-lite
    chat-rate-limit-per-minute: 20
    chat-timeout-seconds: 12
    max-output-tokens: 1000
    temperature: 0.2

