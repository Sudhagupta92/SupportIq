spring:
  autoconfigure:
    exclude:
      - org.springframework.ai.vectorstore.pgvector.autoconfigure.PgVectorStoreAutoConfiguration
  datasource:
    url: jdbc:h2:mem:supportiq_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

app:
  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    expiration-ms: 86400000
  default-admin:
    email: admin@supportiq.com
    password: Admin@12345
    name: SupportIQ Admin
  rag:
    gemini:
      api-key: test-api-key
      model: gemini-embedding-001
      dimension: 768
      batch-size: 16
    chunk-size: 800
    chunk-overlap: 100
    max-file-size: 10485760
    chat-top-k: 4
    min-score: 0.58
    chat-model: gemini-3.5-flash
    fallback-chat-model: gemini-3.1-flash-lite
    chat-rate-limit-per-minute: 20
    chat-timeout-seconds: 12
    max-output-tokens: 1000
    temperature: 0.2
    order-intent-keywords: order,orders,track,tracking,parcel,package,delivery,delivered,shipped,status,kahan,kab aayega,ye order,mera order
  tickets:
    daily-limit: 5
  escalation:
    high-keywords: fraud,scam,cheated,damaged,broken,dhokha,toota,loot,fake,chor
    medium-keywords: refund not received,refund,complaint,wrong item,manager,worst,angry,bekar,kharab,wapas nahi mila,not received,defective,gussa
    explicit-keywords: create a ticket,create ticket,raise a ticket,raise ticket,ticket banao,ticket bana do,ticket bana de,ticket kholo,open a ticket,open ticket,talk to a human,talk to human,speak to a human,speak to human,speak with a human,speak with human,human agent,real agent,live agent,insaan se baat,insan se baat,bande se baat,support se baat karao,support se baat karwao,agent se baat,customer care se baat,complaint register,register complaint,file a complaint,file complaint,raise a complaint,raise complaint
  demo-data:
    enabled: false

